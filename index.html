<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Executive E-Library — Interactive Demo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--navy:#102946;--gold:#b98227;--cream:#f8f6f1;--muted:#6c7786;--border:#e8e6e1}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',Arial,sans-serif;color:var(--navy);background:#fff}button,input{font:inherit}button{cursor:pointer}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 max(5%,calc((100% - 1190px)/2));background:white;position:sticky;top:0;z-index:10;border-bottom:1px solid #eee}.logo{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px;cursor:pointer}.logo span{color:var(--gold);font-size:33px}nav{display:flex;gap:28px;align-items:center}nav button,.plain{background:none;border:0;color:var(--navy);font-weight:600}nav button:hover,.active{color:var(--gold)!important}.gold{background:var(--gold);border:1px solid var(--gold);color:white;padding:12px 23px;border-radius:7px;font-weight:700}.outline{background:white;border:1px solid #b8c0c8;color:var(--navy);padding:12px 23px;border-radius:7px;font-weight:700}.menu{display:none}.wrap{max-width:1190px;margin:auto;padding:0 22px}.hero{background:linear-gradient(90deg,#faf9f6 0%,#faf9f6 48%,#ede6d9 100%);overflow:hidden}.hero-inner{min-height:440px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:20px}.eyebrow{letter-spacing:3px;color:var(--gold);font-size:11px;font-weight:700;text-transform:uppercase}.hero h1{font:700 clamp(38px,4.6vw,65px)/1.12 'Playfair Display',serif;margin:16px 0}.hero h1 em{font-style:normal;color:var(--gold)}.hero p{font-size:16px;line-height:1.8;color:#43516a;max-width:550px}.hero-art{height:390px;position:relative;display:flex;align-items:center;justify-content:center}.art-shelf{width:94%;height:76%;border-radius:160px 160px 18px 18px;background:linear-gradient(145deg,#433626,#a98659);box-shadow:inset 0 0 0 16px #e2d2b8,0 24px 50px #67502a33;display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:30px 24px}.spine{height:var(--h);width:13%;background:var(--c);border-radius:3px;box-shadow:inset 5px 0 #ffffff18,inset -4px 0 #0003;display:flex;align-items:center;justify-content:center;color:#e4c48b;font-size:11px;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:2px;font-family:serif}.search{display:flex;background:#fff;padding:6px;border:1px solid #ddd;border-radius:10px;box-shadow:0 6px 24px #0000000a;max-width:600px}.search input{border:0;outline:0;padding:12px 14px;flex:1;min-width:0}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{background:#f0f1f2;border:0;border-radius:30px;padding:8px 12px;font-size:12px;color:#384960}.stats{display:flex;justify-content:space-around;gap:15px;padding:24px 0;flex-wrap:wrap}.stats strong{font:700 22px 'Playfair Display',serif}.stats small{display:block;color:var(--muted)}section{padding:46px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:24px}.section-head h2,h2{font:700 clamp(25px,3vw,34px) 'Playfair Display',serif;margin:8px 0}.link{background:none;border:0;color:var(--navy);font-weight:700}.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.category{border:1px solid var(--border);border-radius:12px;padding:22px;cursor:pointer;background:#fff;transition:.2s}.category:hover,.book:hover,.insight:hover{transform:translateY(-3px);box-shadow:0 12px 25px #142e4c12}.cat-icon{font-size:30px;background:#f5f0e6;width:58px;height:58px;display:grid;place-items:center;border-radius:10px;margin-bottom:12px}.category strong{display:block}.category small,.book small{color:var(--muted)}.books{display:grid;grid-template-columns:repeat(5,1fr);gap:22px}.book{cursor:pointer;transition:.2s}.cover{height:225px;border-radius:6px;display:flex;flex-direction:column;justify-content:space-between;padding:20px 14px;color:white;box-shadow:5px 7px 12px #0002,inset 6px 0 #ffffff24;overflow:hidden}.cover b{font:700 22px/1.2 'Playfair Display',serif}.cover small{color:inherit;opacity:.8}.book h3{font-size:14px;margin:15px 0 4px}.book small{font-size:12px}.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.insight{border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}.insight-art{height:130px;background:linear-gradient(130deg,#173453,#bb9151);display:grid;place-items:center;font-size:56px}.insight-body{padding:20px}.insight h3{font:700 20px 'Playfair Display',serif}.banner{background:linear-gradient(115deg,#09243e,#315779);color:white;border-radius:12px;padding:36px;display:flex;justify-content:space-between;align-items:center;gap:20px}.banner h2{color:white}footer{border-top:1px solid var(--border);padding:30px 0;color:var(--muted);font-size:13px}.footer-inner{display:flex;justify-content:space-between;gap:20px}.page{min-height:70vh}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}.toolbar input,.field{padding:13px;border:1px solid var(--border);border-radius:8px;min-width:0}.toolbar input{flex:1}.details{display:grid;grid-template-columns:280px 1fr;gap:50px;align-items:start;padding-top:45px}.details .cover{height:390px}.details h1{font:700 42px 'Playfair Display',serif}.details p{line-height:1.9;color:#536177}.details .actions{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}.reader{max-width:770px;margin:35px auto;background:#fff;border:1px solid var(--border);border-radius:12px;padding:clamp(25px,6vw,70px);box-shadow:0 12px 50px #10294609}.reader h1{font:700 40px 'Playfair Display',serif}.reader p{font:19px/2 Georgia,serif;color:#243850}.reader-controls{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.empty{padding:65px 10px;text-align:center;color:var(--muted)}.notice{background:#fff6df;border:1px solid #f1dda9;padding:12px 15px;border-radius:8px;color:#695126;font-size:13px;margin:20px 0}.bottom{display:none}.hidden{display:none!important}@media(max-width:800px){header{height:67px;padding:0 17px}.logo{font-size:20px}.logo span{font-size:26px}nav{display:none;position:absolute;top:67px;left:0;right:0;background:white;padding:18px;box-shadow:0 20px 30px #0002;flex-direction:column;align-items:stretch}nav.open{display:flex}.menu{display:block;background:none;border:0;font-size:26px}.hero-inner{grid-template-columns:1fr;gap:0;padding-top:35px}.hero h1{font-size:43px}.hero-art{height:170px}.art-shelf{height:100%;width:80%;border-radius:70px 70px 0 0;padding:20px}.spine{font-size:8px}.stats{justify-content:space-between}.stats>div{width:43%}.categories{grid-template-columns:repeat(2,1fr)}.books{grid-template-columns:repeat(2,1fr);gap:17px}.cover{height:215px}.insights{grid-template-columns:1fr}.banner,.footer-inner{flex-direction:column;align-items:start}.details{grid-template-columns:1fr;gap:25px}.details>.cover{width:210px;height:300px;margin:auto}.details h1{font-size:34px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--border);z-index:20;justify-content:space-around;padding:10px 0 12px}.bottom button{background:none;border:0;font-size:11px;color:var(--navy)}.bottom button span{display:block;font-size:20px;margin-bottom:3px}body{padding-bottom:65px}section{padding:32px 0}.section-head h2{font-size:27px}}@media(max-width:380px){.hero h1{font-size:36px}.cover{height:185px}.cover b{font-size:18px}.category{padding:14px}}
</style></head><body><header><div class="logo" onclick="go('home')"><span>♧</span> Executive <small style="font:700 9px DM Sans;letter-spacing:2px;align-self:end;margin:0 0 5px -6px">E-LIBRARY</small></div><nav id="nav"><button onclick="go('home')">Home</button><button onclick="go('explore')">Explore Library</button><button onclick="go('categories')">Categories</button><button onclick="go('insights')">Insights</button><button onclick="go('library')">My Library</button><button onclick="go('login')" class="outline">Login</button></nav><button class="menu" onclick="document.getElementById('nav').classList.toggle('open')">☰</button></header><main id="app"></main><footer><div class="wrap footer-inner"><div><strong>Executive E-Library</strong><p>Knowledge for better decisions.</p></div><div>Interactive concept demo · Sample content only · © 2026</div></div></footer><div class="bottom"><button onclick="go('home')"><span>⌂</span>Home</button><button onclick="go('explore')"><span>▦</span>Explore</button><button onclick="go('library')"><span>▤</span>Library</button><button onclick="go('insights')"><span>◫</span>Insights</button><button onclick="go('login')"><span>♙</span>Account</button></div><script>
const books=[{id:1,title:'Atomic Habits',author:'James Clear',cat:'Personal Development',bg:'#e6d9c3',fg:'#9c6325',desc:'An exploration of small daily improvements and the power of consistent habits.'},{id:2,title:'Thinking, Fast and Slow',author:'Daniel Kahneman',cat:'Leadership & Management',bg:'#e7e3d9',fg:'#243449',desc:'Explore two modes of thinking and the biases that shape decisions.'},{id:3,title:'The 5 AM Club',author:'Robin Sharma',cat:'Personal Development',bg:'#e36c34',fg:'#fff',desc:'A practical approach to routines, productivity and personal growth.'},{id:4,title:'Dare to Lead',author:'Brené Brown',cat:'Leadership & Management',bg:'#e7eee8',fg:'#17565d',desc:'A guide to courage, vulnerability and effective leadership.'},{id:5,title:'The Lean Startup',author:'Eric Ries',cat:'Business & Economics',bg:'#12669b',fg:'#fff',desc:'How to build products, test assumptions and learn from customers.'},{id:6,title:'Principles',author:'Ray Dalio',cat:'Business & Economics',bg:'#1a1a1c',fg:'#fff',desc:'Principles for work, life and thoughtful decision-making.'},{id:7,title:'The Innovators',author:'Walter Isaacson',cat:'Technology & Innovation',bg:'#2d5671',fg:'#fff',desc:'Stories about the people and collaborations behind the digital revolution.'},{id:8,title:'The Art of Strategy',author:'Avinash Dixit & Barry Nalebuff',cat:'Politics & Governance',bg:'#755d4b',fg:'#fff',desc:'An introduction to strategic thinking and decision-making.'}];const cats=[['Business & Economics','▥'],['Leadership & Management','♟'],['Technology & Innovation','⌘'],['Politics & Governance','⚖'],['Personal Development','✧'],['Global Affairs','◎']];const insights=[['The Future of Leadership in a Changing World','Leadership','♟'],['Building a Growth Mindset','Personal Growth','🌱'],['Why Innovation Matters for Africa’s Development','Innovation','✦']];let saved=JSON.parse(localStorage.getItem('elibrarySaved')||'[]'),page='home',selected=books[0],readerSize=19,readerPage=1;const app=document.getElementById('app');function cover(b){return `<div class="cover" style="background:${b.bg};color:${b.fg}"><small>EXECUTIVE E-LIBRARY · DEMO</small><b>${b.title}</b><small>${b.author}</small></div>`}function bookCards(arr){return `<div class="books">${arr.map(b=>`<article class="book" onclick="openBook(${b.id})">${cover(b)}<h3>${b.title}</h3><small>${b.author}</small></article>`).join('')}</div>`}function head(label,title,link,target){return `<div class="section-head"><div><div class="eyebrow">${label}</div><h2>${title}</h2></div><button class="link" onclick="go('${target}')">${link} →</button></div>`}function categories(){return `<div class="categories">${cats.map(([name,icon])=>`<article class="category" onclick="go('explore','${name.replaceAll("'","\\'")}')"><div class="cat-icon">${icon}</div><strong>${name}</strong><small>Explore collection →</small></article>`).join('')}</div>`}function insightCards(){return `<div class="insights">${insights.map(([title,tag,icon],i)=>`<article class="insight" onclick="go('article',${i})"><div class="insight-art">${icon}</div><div class="insight-body"><div class="eyebrow">${tag}</div><h3>${title}</h3><small>5 min read · Read insight →</small></div></article>`).join('')}</div>`}function home(){return `<div class="hero"><div class="wrap hero-inner"><div><div class="eyebrow">Knowledge. Leadership. Impact.</div><h1>Ideas Today for a <em>Better Tomorrow</em></h1><p>Explore books, expert insights and trusted knowledge to help you learn, lead and make informed decisions.</p><form class="search" onsubmit="event.preventDefault();go('explore',this.q.value)"><input name="q" placeholder="Search books, authors, topics..." aria-label="Search books"><button class="gold">Search →</button></form><div class="chips"><span style="font-size:12px;padding:8px 0">Popular:</span>${['Leadership','Strategy','Technology','Personal Development'].map(x=>`<button class="chip" onclick="go('explore','${x}')">${x}</button>`).join('')}</div></div><div class="hero-art"><div class="art-shelf">${[['LEADERSHIP','72%','#172b40'],['INNOVATION','90%','#2d3c48'],['STRATEGY','80%','#7b4d31'],['WISDOM','97%','#16273b'],['GROWTH','67%','#6b5039']].map(x=>`<div class="spine" style="--h:${x[1]};--c:${x[2]}">${x[0]}</div>`).join('')}</div></div></div></div><div class="wrap stats"><div><strong>Curated</strong><small>Knowledge collections</small></div><div><strong>6</strong><small>Explore disciplines</small></div><div><strong>Global</strong><small>Perspectives</small></div><div><strong>Anytime</strong><small>Responsive reading</small></div></div><section class="wrap">${head('Explore categories','Discover Knowledge Across Disciplines','View all','categories')}${categories()}</section><section class="wrap">${head('Featured books','Recommended for You','View all','explore')}${bookCards(books.slice(0,5))}</section><section class="wrap">${head('Executive insights','Ideas for Informed Leadership','View all','insights')}${insightCards()}</section><section class="wrap"><div class="banner"><div><div class="eyebrow">Lifelong learning</div><h2>Start Your Knowledge Journey Today</h2><p>Explore ideas that inspire better decisions.</p></div><button class="gold" onclick="go('explore')">Explore Library →</button></div></section>`}function explore(q=''){const term=q.toLowerCase(),items=books.filter(b=>(b.title+' '+b.author+' '+b.cat).toLowerCase().includes(term));return `<section class="wrap page"><div class="eyebrow">Library catalogue</div><h2>Explore Books</h2><p style="color:var(--muted)">Search the demonstration collection. Real book data will be connected later.</p><div class="toolbar"><input id="filter" placeholder="Search by title, author or category" value="${q.replaceAll('"','&quot;')}" oninput="filterBooks(this.value)"><button class="outline" onclick="filterBooks('')">Clear</button></div><div id="book-results">${items.length?bookCards(items):'<div class="empty">No books match your search.</div>'}</div></section>`}function filterBooks(v){document.getElementById('book-results').innerHTML=bookCards(books.filter(b=>(b.title+' '+b.author+' '+b.cat).toLowerCase().includes(v.toLowerCase())));if(!document.querySelector('#book-results .book'))document.getElementById('book-results').innerHTML='<div class="empty">No books match your search.</div>'}function detail(){const b=selected;return `<section class="wrap page"><button class="plain" onclick="go('explore')">← Back to library</button><div class="details">${cover(b)}<div><div class="eyebrow">${b.cat}</div><h1>${b.title}</h1><p>By ${b.author}</p><div class="notice">Demo preview: book descriptions and reader passages are illustrative. No copyrighted book text is provided.</div><h3>About this book</h3><p>${b.desc}</p><div class="actions"><button class="gold" onclick="readerPage=1;go('reader')">Read Demo Preview →</button><button class="outline" onclick="toggleSave(${b.id})">${saved.includes(b.id)?'✓ Saved to My Library':'♡ Add to My Library'}</button></div><small style="color:var(--muted)">Digital book access will depend on licensing and the final content collection.</small></div></div></section>`}function reader(){return `<section class="wrap page"><div class="reader-controls"><button class="plain" onclick="go('detail')">← ${selected.title}</button><div><button class="outline" onclick="readerSize=Math.max(15,readerSize-2);go('reader')">A−</button> <button class="outline" onclick="readerSize=Math.min(27,readerSize+2);go('reader')">A+</button></div></div><article class="reader"><div class="eyebrow">Demonstration reading interface</div><h1>${readerPage===1?'Chapter 1: A New Perspective':'Chapter 2: From Ideas to Action'}</h1><p style="font-size:${readerSize}px">${readerPage===1?'Knowledge becomes valuable when we turn understanding into thoughtful action. Great leaders remain curious, challenge assumptions and continue learning throughout their lives.':'The strongest ideas are not always the loudest. They are the ones tested carefully, discussed openly and improved through experience. Progress begins with a willingness to learn.'}</p><p style="font-size:${readerSize}px">This is original placeholder text created for the interactive demonstration. When the real book collection is available, this interface can be connected to authorized PDF or EPUB content.</p><div class="reader-controls"><button class="outline" onclick="readerPage=1;go('reader')">← Previous</button><span>Preview ${readerPage} / 2</span><button class="gold" onclick="readerPage=readerPage===1?2:1;go('reader')">${readerPage===1?'Next →':'Start again ↺'}</button></div></article></section>`}function library(){const list=books.filter(b=>saved.includes(b.id));return `<section class="wrap page"><div class="eyebrow">Personal collection</div><h2>My Library</h2><p style="color:var(--muted)">Books you saved in this browser.</p>${list.length?bookCards(list):'<div class="empty">Your library is empty.<br><br><button class="gold" onclick="go(\'explore\')">Discover Books →</button></div>'}</section>`}function login(){return `<section class="wrap page" style="max-width:490px"><div class="eyebrow">Your account</div><h2>Welcome Back</h2><div class="notice">Authentication is not connected in this concept demo.</div><form onsubmit="event.preventDefault();alert('Demo only — sign-in will be connected during development.')"><p><input class="field" type="email" placeholder="Email address" required style="width:100%"></p><p><input class="field" type="password" placeholder="Password" required style="width:100%"></p><button class="gold" style="width:100%">Sign In</button></form></section>`}function article(i){const x=insights[i]||insights[0];return `<section class="wrap page" style="max-width:800px"><button class="plain" onclick="go('insights')">← All Insights</button><div class="eyebrow" style="margin-top:35px">${x[1]}</div><h2>${x[0]}</h2><div class="insight-art" style="height:260px;border-radius:12px;margin:25px 0">${x[2]}</div><p style="font:20px/1.9 Georgia,serif">Leadership begins with curiosity. Good decisions require time to reflect, a willingness to listen and the discipline to learn from evidence.</p><div class="notice">Original illustrative article text for demonstration only.</div></section>`}function go(p,arg=''){page=p;document.getElementById('nav').classList.remove('open');app.innerHTML=p==='home'?home():p==='explore'?explore(String(arg)):p==='categories'?`<section class="wrap page"><div class="eyebrow">Knowledge areas</div><h2>All Categories</h2>${categories()}</section>`:p==='detail'?detail():p==='reader'?reader():p==='library'?library():p==='insights'?`<section class="wrap page">${head('Curated thinking','Executive Insights','Explore books','explore')}${insightCards()}</section>`:p==='article'?article(Number(arg)):login();window.scrollTo(0,0)}function openBook(id){selected=books.find(b=>b.id===id);go('detail')}function toggleSave(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem('elibrarySaved',JSON.stringify(saved));go('detail')}go('home');
</script></body></html>
